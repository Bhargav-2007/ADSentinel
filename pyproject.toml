[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adsentinel"
version = "0.1.0"
description = "Authorized AD and hybrid identity evidence assessment"
requires-python = ">=3.11"
dependencies = ["rich>=13.9", "PyYAML>=6.0.2", "ldap3>=2.9.1", "httpx>=0.28"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "types-PyYAML", "pip-audit", "bandit"]

[project.scripts]
adsentinel = "adsentinel.cli:main"

[tool.setuptools.packages.find]
include = ["adsentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
