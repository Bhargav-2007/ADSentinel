# Documentation example; actual engagement scope belongs under ignored results/authorization/.
target:
  domain: corp.example
  domain_controller: dc01.corp.example
  ldap_port: 389
  ldaps_port: 636
  entra_tenant: example-tenant
authentication:
  username: reader@corp.example
  password_env: ADS_SENTINEL_PASSWORD
  graph_token_env: ADS_SENTINEL_GRAPH_TOKEN
  kerberos: false
  hashes: false
scan:
  mode: passive
  modules: [recon, kerberos, adcs, delegation, acl, dcsync-check, gpo, laps, gmsa, trusts, account-hygiene, password-policy, privileged-access, baseline, detection-coverage]
output:
  directory: results
  formats: [json, markdown, html]
safety:
  require_authorization: true
  allow_credential_extraction: false
  allow_certificate_requests: false
  allow_relay_validation: false
  allow_password_spraying: false
  max_parallel_tasks: 5
  timeout_seconds: 30
